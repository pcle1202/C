<style>

.px{font-family:'DotGothic16',sans-serif}

@keyframes camOn{0%,40%{opacity:0;filter:brightness(4) saturate(0)}55%{opacity:1;filter:brightness(2.4) saturate(.3)}100%{opacity:1;filter:none}}
@keyframes camLine{0%,30%{transform:scaleY(.02);opacity:1}48%{transform:scaleY(1);opacity:.9}70%,100%{transform:scaleY(1);opacity:0}}

@keyframes uiIn{0%,65%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes itemZoom{0%{transform:translate(0,0) scale(1);filter:brightness(1)}35%{transform:translate(calc(var(--dx)*.2),calc(var(--dy)*.2)) scale(.92,1.08);filter:brightness(1.25)}100%{transform:translate(var(--dx),var(--dy)) scale(var(--zs));filter:brightness(1.1)}}
@keyframes zoomDim{0%{opacity:0}100%{opacity:1}}
@keyframes paperOut{0%{transform:translateY(150px) scale(.3);filter:brightness(1)}45%{transform:translateY(20px) scale(.4);filter:brightness(1.15)}75%{transform:translateY(-6px) scale(.9)}100%{transform:translateY(0) scale(.86);filter:brightness(1)}}
@keyframes envAway{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(160px) scale(.85);opacity:0}}
@keyframes flashOut{0%,55%{opacity:0}70%{opacity:.55}100%{opacity:0}}
@keyframes pipPulse{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.3) translateY(-4px)}}
@keyframes bigBeat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(1)}60%{transform:scale(1.08)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes heartpop{0%{transform:scale(0) translateY(12px);opacity:0}25%{transform:scale(1.2) translateY(0);opacity:1}75%{transform:scale(1) translateY(-6px);opacity:1}100%{transform:scale(1) translateY(-14px);opacity:0}}
@keyframes hbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}12%{transform:scale(.5);opacity:1}24%{transform:scale(1);opacity:1}48%{transform:scale(.5);opacity:1}60%{transform:scale(0);opacity:0}}
.spark{animation:twinkle 1600ms steps(1) infinite}
.pxbob{animation:bob 900ms steps(2) infinite}
.heart{transform-origin:20% 100%;animation:heartpop 2400ms steps(12) both}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@keyframes nudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 16px;box-sizing:border-box">

        <sc-if value="{{ endReady }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;z-index:3;animation:fadein 500ms steps(4) both">
            <div class="pxbob" style="pointer-events:auto;padding:3px;background:#4A2230;clip-path:polygon(0px 10px,2px 10px,2px 6px,4px 6px,4px 4px,6px 4px,6px 2px,10px 2px,10px 0px,calc(100% - 10px) 0px,calc(100% - 10px) 2px,calc(100% - 6px) 2px,calc(100% - 6px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 6px,calc(100% - 2px) 6px,calc(100% - 2px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 2px) calc(100% - 10px),calc(100% - 2px) calc(100% - 6px),calc(100% - 4px) calc(100% - 6px),calc(100% - 4px) calc(100% - 4px),calc(100% - 6px) calc(100% - 4px),calc(100% - 6px) calc(100% - 2px),calc(100% - 10px) calc(100% - 2px),calc(100% - 10px) 100%,10px 100%,10px calc(100% - 2px),6px calc(100% - 2px),6px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 6px),2px calc(100% - 6px),2px calc(100% - 10px),0px calc(100% - 10px));cursor:pointer;user-select:none;transition:transform 80ms steps(2)" style-hover="transform:translateY(-2px);filter:brightness(1.08)" style-active="transform:translateY(1px)" onClick="{{ replay }}"><div style="display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DotGothic16',sans-serif;font-size:13px;line-height:1;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600;font-size:15px;padding:4px 10px 6px;color:#4A2230;background:#F7A8BC;box-shadow:inset 0 3px 0 #FFD0DC,inset 0 -4px 0 #D97F98;clip-path:polygon(0px 8px,2px 8px,2px 4px,4px 4px,4px 2px,8px 2px,8px 0px,calc(100% - 8px) 0px,calc(100% - 8px) 2px,calc(100% - 4px) 2px,calc(100% - 4px) 4px,calc(100% - 2px) 4px,calc(100% - 2px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 2px) calc(100% - 8px),calc(100% - 2px) calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) calc(100% - 2px),calc(100% - 8px) calc(100% - 2px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 2px),4px calc(100% - 2px),4px calc(100% - 4px),2px calc(100% - 4px),2px calc(100% - 8px),0px calc(100% - 8px))"><span style="font-size:13px">&#8634;</span>replay</div></div>

      heartOn: (!!st.heartAt && now - st.heartAt < 2400 && !st.popup) || (!!st.coupleHeartAt && now - st.coupleHeartAt < 2400 && st.screen === 'inside'),
      showRoomHint: !st.popup && doneN < 3,
      roomHint: doneN === 0 ? 'click anything!' : 'there\u2019s more to see!',
      openCake: () => this.walkThen(78, 260, () => this.zoomThen('cake', this.openCake)), openLetter: () => this.walkThen(232, 364, () => this.zoomThen('letter', this.openLetter)), openBoard: () => this.walkThen(70, 126, () => this.zoomThen('board', this.openBoard)),
      cakeRowTop: st.popup === 'cake' && !st.blownAt && now - (st.cakeOpenAt || 0) > 8000 ? '416px' : '416px',
      cakeTipOn: st.popup === 'cake' && !st.blownAt,
      cakeTip: 'make a wish, then blow!'.slice(0, Math.max(0, Math.floor((now - (st.cakeOpenAt || 0) - 1800) / 110))),
      ...(() => { const ready = doneN >= 3 && !st.prim && !st.mergeAt; const mf = st.mergeAt && !st.bigGone ? this.mergeFrame(now) : null;
        return { showPips: !st.prim && !st.mergeAt && st.screen === 'inside', pipsPE: ready && !st.popup ? 'auto' : 'none',
          pips: [0,1,2].map(i => ({ src: i < (st.progress || 0) ? 'assets/heart_full.png?v=3' : 'assets/heart_empty.png?v=3', anim: ready ? 'pipPulse 900ms steps(3) ' + (i * 150) + 'ms infinite' : 'none', glow: ready ? 'drop-shadow(0 0 8px rgba(255,180,200,.95))' : '' })),
          mergeOn: !!mf, mergeHs: mf ? mf.hs : [], bigOn: !!(mf && mf.big), mergeDim: mf ? mf.dim : '0',
          endArrowOn: !!st.prim && st.prim.phase === 'follow' && !st.popup && st.screen === 'inside' }; })(),
      mergeHearts: this.mergeHearts,
      confirmOn: !!st.confirmEnd,
      cancelEnd: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ confirmEnd: false }); },
      confirmEndYes: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.pop(); this.setState({ confirmEnd: false }); this.fadeTo('end'); setTimeout(() => this.startBoot(true), 900); },
      bigClick: () => { this.pop(); this.setState({ bigGone: true }); this.walkThen(Math.min(st.cx, 230), 999, this.startPrim); },
      showBlowBtn: st.popup === 'cake' && !st.blownAt && now - (st.cakeOpenAt || 0) > 8000,
      zoomOnItem: !!st.zoomItem && !st.popup,
      zi: (() => { const z = st.zoomItem; if (!z) return {}; const R = { board: [40, 28, 172, 160, 'url(assets/board_small.png)', '172px 160px', '0 0', 2.2], cake: [180, 152, 160, 160, 'url(assets/cake.png)', '800px 160px', fr(cakeF, 160), 2], letter: [336, 284, 56, 40, 'url(assets/envelope_small.png?v=2)', '56px 40px', '0 0', 5] }[z]; const [l, t, w, hh, bg, bs, bp, zs] = R; return { left: l + 'px', top: t + 'px', w: w + 'px', h: hh + 'px', bg, bs, bp, zs, dx: (240 - l - w / 2) + 'px', dy: (240 - t - hh / 2) + 'px' }; })(),
      closePop: this.close, stop: (e) => e.stopPropagation(),
      popCake: st.popup === 'cake', popEnv: st.popup === 'env', popPaper: st.popup === 'paper', popBoard: st.popup === 'board',
      recColor: st.cam === 'on' ? '#E0505A' : '#C9B79E', recLabel: st.cam === 'on' ? 'live' : 'camera',
      snowRef: this.snowRef, winRef: this.winRef,
      camRef: this.camRef, confRef: this.confRef, camMsgOn: !!camMsg, camMsg,
      cakeMsg: lit ? 'make a wish, then blow!' : '', glowOp: lit ? 1 : .15, camBright: lit ? 1 : .7,
      cakeMsgColor: lit ? '#5B3A29' : '#C0573E',
      cakeClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (st.blownAt) this.close(); },
      blow: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (!st.blownAt) this.doBlow(); },
      lit, blownOut: !lit, relight: this.relight, blowPct: Math.round((st.blowP || 0) * 100) + '%', airPct: Math.round(Math.min(1, st.air) * 100) + '%',
      envPos: fr(st.envF, 280), envClick: this.envClick,
      letterRef: this.letterRef, scrollRef: this.scrollRef, letterClick: this.letterClick,
      letterDone: st.letterPhase === 'done', rescramble: (e) => { e.stopPropagation(); this.sfx(300, .1, 'triangle', .04, .6); this.setState({ letterPhase: 'drop' }, () => this.startLetter()); },
      letterDrop: st.letterPhase === 'drop',
      letterRowTop: st.letterPhase === 'drop' ? '444px' : '404px',
      unscrTip: 'click to unscramble'.slice(0, Math.max(0, Math.floor((now - (st.paperAt || 0) - 900) / 90))),
      envHintOp: st.envF > 0 ? 0 : 1, envOut: !!st.envOutAt,
      envAnim: st.envOutAt ? 'envAway 1000ms ease-in both' : 'popin 650ms cubic-bezier(.34,1.56,.64,1)', letterHintOn: st.letterPhase !== 'assemble',
      letterHint: st.letterPhase === 'done' ? 'click to continue \u25B6' : 'click to unscramble!',
      photos,
      zoomOn: st.zoom != null, zTint: st.zoom != null ? tints[st.zoom] : '#FFF', zCaption: st.zoom != null ? caps[st.zoom] : '',
      unzoom: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ zoom: null });
        if (Object.keys(this.state.viewed).length >= 4 && !this.state.done.board) { clearTimeout(this.bct); this.bct = setTimeout(() => { if (this.state.popup === 'board' && this.state.zoom == null) this.close(); }, 700); } },
      boardHint: st.zoom != null ? 'click to put it back' : (vN >= 4 ? 'click outside to continue \u25B6' : 'click a photo to look closer (' + vN + '/4)'),
      jumps: [
        { label: 'boot', go: () => { this.close(); this.setState({ screen: 'boot' }); this.startBoot(); this.initSnow(); } },
        { label: 'outside', go: () => { this.close(); clearTimeout(this.bt); this.fadeTo('outside'); } },
        { label: 'inside', go: () => { this.close(); this.setState({ screen: 'inside' }); } },
        { label: 'cake', go: () => { this.setState({ screen: 'inside' }); this.openCake(); } },
        { label: 'letter', go: () => { this.setState({ screen: 'inside' }); this.openLetter(); } },
        { label: 'board', go: () => { this.setState({ screen: 'inside' }); this.openBoard(); } },
        { label: 'all done', go: () => { this.close(); this.setState({ mergeAt: 0, bigGone: false, everBlown: true, cakeSeen: true, screen: 'inside', done: { cake: 1, letter: 1, board: 1 }, blownAt: 1, letterPhase: 'done', letterPage: 0, letterAllDone: true, envF: 4, viewed: { 0: 1, 1: 1, 2: 1, 3: 1 } }); } },
        { label: 'dim (unblown)', go: () => { this.close(); clearTimeout(this.endT); this.trail = null; this.setState({ everBlown: false, cakeSeen: false, introSaid: true, cutscene: false, screen: 'inside', fade: false, popup: null, done: {}, blownAt: 0, blowP: 0, air: 0, letterPhase: 'drop', letterPage: 0, letterAllDone: false, envF: 0, viewed: {}, cx: 40, face: 1, goal: null, enterWalk: false, exitWalk: false, prim: null, pox: null, cap: null }); } },
        { label: 'lit (blown)', go: () => { this.close(); clearTimeout(this.endT); this.trail = null; this.setState({ everBlown: true, cakeSeen: true, introSaid: true, cutscene: false, screen: 'inside', fade: false, popup: null, done: { cake: 1 }, blownAt: 1, blowP: 0, air: 0, letterPhase: 'drop', letterPage: 0, letterAllDone: false, envF: 0, viewed: {}, cx: 40, face: 1, goal: null, enterWalk: false, exitWalk: false, prim: null, pox: null, cap: null }); } },
        { label: 'prim mode', go: () => { this.close(); clearTimeout(this.endT); this.trail = null; this.setState({ everBlown: true, cakeSeen: true, cutscene: false, screen: 'inside', fade: false, popup: null, done: { cake: 1, letter: 1, board: 1 }, blownAt: 1, letterPhase: 'done', letterPage: 0, letterAllDone: true, envF: 4, viewed: { 0: 1, 1: 1, 2: 1, 3: 1 }, cx: 200, face: 1, goal: null, enterWalk: false, exitWalk: false, prim: { x: 100, phase: 'follow' }, pox: null, questT: '', cap: null }); } },
        { label: 'ending', go: () => { this.close(); this.setState({ screen: 'end', bootN: 0 }); this.startBoot(true); } },
        { label: 'reset', go: this.reset }
      ]
    };
  }
